apiVersion: tekton.dev/v1
kind: Task
metadata:
name: cleanup
spec:
workspaces:
- name: source
steps:
- name: cleanup
image: alpine:3.19
script: |
#!/bin/sh
set -e
find $(workspaces.source.path) -mindepth 1 -maxdepth 1 -exec rm -rf {} +
echo "Cleanup completed successfully"

---

apiVersion: tekton.dev/v1
kind: Task
metadata:
name: git-clone
spec:
params:
- name: url
type: string
- name: revision
type: string
default: main
workspaces:
- name: source
steps:
- name: clone
image: alpine/git:latest
script: |
#!/bin/sh
set -e
rm -rf $(workspaces.source.path)/*
git clone --branch $(params.revision) $(params.url) $(workspaces.source.path)
echo "Git clone completed successfully"

---

apiVersion: tekton.dev/v1
kind: Task
metadata:
name: flake8
spec:
workspaces:
- name: source
steps:
- name: lint
image: python:3.11-slim
workingDir: $(workspaces.source.path)
script: |
#!/bin/sh
set -e
pip install --no-cache-dir flake8
flake8 . --exclude=.git,db.sqlite3
echo "Flake8 completed successfully"

---

apiVersion: tekton.dev/v1
kind: Task
metadata:
name: nose
spec:
workspaces:
- name: source
steps:
- name: test
image: python:3.11-slim
workingDir: $(workspaces.source.path)
script: |
#!/bin/sh
set -e
pip install --no-cache-dir Django nose
nosetests
echo "Nose tests completed successfully"
